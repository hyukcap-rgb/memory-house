<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>기억의 집 · 시제품</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<style>
:root{--night:#0E1220;--gold:#E7C77B;--sub:#AEB5C6}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(90% 60% at 50% 0%,#1E2440,var(--night) 70%);color:#fff;font-family:'Noto Sans KR',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:56px 16px}
h1{font-family:'Noto Serif KR',serif;font-size:30px;margin-top:8px}
.eb{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.08em}
p.l{color:var(--sub);margin-top:8px;text-align:center;line-height:1.6}
.list{width:100%;max-width:440px;margin-top:32px;display:flex;flex-direction:column;gap:10px}
a.card{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;text-decoration:none;transition:background .15s}
a.card:hover{background:rgba(255,255,255,.1)}
a.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a.card b{font-size:17px}
a.card span{display:block;font-size:13px;color:var(--sub);margin-top:2px}
a.card i{margin-left:auto;font-style:normal;color:var(--gold);font-size:20px}
</style>
</head>
<body>
  <div class="eb">반려동물 메모리얼 · 시제품</div>
  <h1>기억의 집</h1>
  <p class="l">세 화면은 같은 데이터를 써요.<br>비회원 화면에서 예약하면 관리자 화면에 바로 보여요.</p>
  <nav class="list" aria-label="화면 고르기">
    <a class="card" href="/guest"><div><b>비회원 화면</b><span>1004자리 둘러보기 · 자리 고르기 · 예약</span></div><i aria-hidden="true">›</i></a>
    <a class="card" href="/member"><div><b>회원 화면</b><span>보리의 메모리얼 · 참배 · 기억의 방 · 보존</span></div><i aria-hidden="true">›</i></a>
    <a class="card" href="/admin"><div><b>관리자 페이지</b><span>예약 · 양도 승인 · 방명록 관리</span></div><i aria-hidden="true">›</i></a>
  </nav>
</body>
</html>
