<title>기억의 집 · 내 메모리얼</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --night:#1A2238; --navy:#2E4374; --gold:#E7C77B; --cream:#F7F1E3;
  --ink:#1D2130; --sub:#6B7080; --line:#E6E3DD; --bg:#F6F5F2; --card:#FFFFFF;
  --ok:#2F6B4F; --stage:#E9E7E2;
  --sans:'Noto Sans KR','Noto Sans CJK KR',system-ui,sans-serif;
  --serif:'Noto Serif KR','Noto Serif CJK KR',serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --stage:#12141B; } }
:root[data-theme="dark"]{ --stage:#12141B; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--stage)}
body{background:var(--stage);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:center;min-height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#phone{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);box-shadow:0 0 80px rgba(0,0,0,.18)}
body{align-items:stretch!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.bgimg{position:absolute;inset:0;background-size:cover;background-position:center}
.shade-t{position:absolute;left:0;right:0;top:0;height:180px;background:linear-gradient(rgba(10,14,26,.6),rgba(10,14,26,0))}
.shade-b{position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(rgba(10,14,26,0),rgba(10,14,26,.88) 55%)}
.status{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:13px;font-weight:700;position:relative;z-index:2}
.light{color:#fff}
.topbar{display:flex;align-items:center;gap:8px;padding:6px 16px 10px;position:relative;z-index:2}
.title{font-size:19px;font-weight:700}
.serif{font-family:var(--serif)}
.glass{background:rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18)}
.glass-dark{background:rgba(20,26,44,.48);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:999px;font-weight:600;font-size:16px;width:100%;transition:transform .15s var(--ease),opacity .15s}
.cta:active{transform:scale(.98)}
.cta.white{background:#fff;color:var(--night)}
.cta.navy{background:var(--navy);color:#fff}
.cta.soft{background:#EDEBE6;color:var(--ink)}
.cta[disabled]{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:500}
.ico{width:22px;height:22px;flex:none}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px}
/* tabbar */
.tabbar{flex:none;height:76px;display:flex;border-top:1px solid var(--line);background:#fff;padding-bottom:8px;position:relative;z-index:3}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:#9A9DA8;min-height:44px}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700}
/* sheet */
#scrim{position:absolute;inset:0;background:rgba(8,10,18,.45);opacity:0;pointer-events:none;transition:opacity .25s var(--ease);z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:10px 20px 28px;transform:translateY(105%);transition:transform .3s var(--ease);z-index:21;max-height:82%;overflow:auto}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:#DDD;margin:0 auto 14px}
#sheet h3{font-size:19px;margin-bottom:6px}
#sheet p{color:var(--sub);font-size:14px;line-height:1.6}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;resize:none;background:#FBFAF8}
textarea:focus,input:focus{outline:2px solid var(--navy);border-color:transparent}
label.fl{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
.lg .in{width:100%;height:52px;border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:0 14px;font:inherit;font-size:16px;background:rgba(255,255,255,.06);color:#fff}
.lg .in:focus{outline:2px solid var(--gold);border-color:transparent}
.lg label{display:block;font-size:13px;font-weight:700;margin:16px 0 6px;color:#DDE2EC}
.lg a{color:var(--gold)}
.ph-none{background:radial-gradient(120% 80% at 50% 25%,#2A3254 0%,#0E1220 70%)!important}
.pwin{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;font-size:16px;background:#FBFAF8}
#toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,12px);background:rgba(26,34,56,.94);color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;opacity:0;transition:all .25s var(--ease);z-index:30;white-space:nowrap;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* seat grid */
.seat{aspect-ratio:1;min-height:44px;border-radius:8px;border:1.5px solid transparent;transition:transform .12s}
.seat.taken{background:#CDD1D9}
.seat.free{background:#fff;border-color:#E2E2E2}
.seat.window{border-color:#D6A94A}
.seat.mine{background:#B9C3D8;border-color:#B9C3D8}
.seat.sel{background:var(--navy);border-color:var(--navy)}
.seat:not(.taken):not(.mine):active{transform:scale(.92)}
.hot{position:absolute;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.hot .dot{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.9);display:grid;place-items:center}
.hot .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
.hot .lbl{font-size:12px;font-weight:700;color:#fff;padding:5px 10px;border-radius:999px}
.bubble{background:#fff;color:var(--ink);font-size:13px;font-weight:700;padding:8px 14px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.18);transition:transform .25s var(--ease)}
.bubble.pop{animation:pop .4s var(--ease)}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.petals{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.petal{position:absolute;top:-20px;font-size:18px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(900px) rotate(240deg);opacity:0}}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:16px;width:100%;text-align:left}
.feedcard{background:#fff;border-radius:18px;overflow:hidden;margin-bottom:14px}
.av{width:32px;height:32px;border-radius:50%;background-size:cover;background-position:center;flex:none}
.progress{height:6px;border-radius:3px;background:#EEE;overflow:hidden;margin-top:14px}
.progress i{display:block;height:100%;width:0;background:var(--navy);transition:width .2s linear}
.hidden{display:none!important}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
<div id="phone" role="application" aria-label="기억의 집 앱 프로토타입">

  <div id="toast" role="status" aria-live="polite" data-testid="toast"></div>
</div>

<script>
const IMG={portrait:'/img/portrait.jpg',hall:'/img/hall.jpg',niche:'/img/niche.jpg',room:'/img/room.jpg',me:'/img/me.jpg',p1:'/img/p1.jpg',p2:'/img/p2.jpg',p3:'/img/p3.jpg',p4:'/img/p4.jpg',p5:'/img/p5.jpg',p6:'/img/p6.jpg',p7:'/img/p7.jpg'};
const I={
 heart:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></svg>',

 home:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20H4z"/><path d="M10 20v-5h4v5"/></svg>',

 orbit:'<svg class="ico" style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="9" ry="4.5"/><circle cx="12" cy="12" r="2"/></svg>',

 chev:'<svg class="ico" style="width:18px;height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',

// ---------- state ----------
// 메모리얼 = 아이가 천사를 만난 날. 회원 화면은 내 아이의 날만 다룬다
const HALLS={};
const dayName=k=>`${+k.slice(0,2)}월 ${+k.slice(3,5)}일`;
function hallOf(k){ return HALLS[k]||(HALLS[k]={name:dayName(k),left:null}); }
const S={
  screen:'entry', tab:null, history:[],
  hall:'09-21', seat:null, pair:false,
  reserved:[], // {hall,code}
  flowers:3, candle:false, todayVisitors:['엄마','지수','보리 친구 2명'],
  guest:[{who:'지수',when:'오늘',text:'보리야 오늘 시험 잘 봤어. 네 덕분이야. 보고 싶어.'}],
  reaction:'보리가 꼬리를 흔들어요', view:'360',
  heir:'지수', backup:true, downloaded:false,
  feed:[
    {who:'엄마',av:'p6',img:'p7',text:'창가 낮잠 자던 오후. 이 햇살을 제일 좋아했지.',when:'3일 전',likes:12},
    {who:'지수',av:null,img:'p5',text:'2019년 생일. 케이크보다 고깔에 더 관심 많던 보보.',when:'1주 전',likes:24},
  ],
  plaza:[
    {name:'콩이',kind:'비숑',hall:'3월 14일',img:'p4',note:'오늘 꽃이 놓였어요'},
    {name:'나비',kind:'코리안숏헤어',hall:'7월 7일',img:'p3',note:'가족이 편지를 남겼어요'},
    {name:'두부',kind:'말티즈',hall:'5월 20일',img:'p1',note:'촛불이 켜져 있어요'},
    {name:'모모',kind:'포메라니안',hall:'3월 14일',img:'p7',note:'오늘 꽃이 놓였어요'},
  ],
  plazaFlowered:{},
};
// seat layout per hall: 5 rows x 6 cols; t=taken f=free w=window(free) m=mine
const LAYOUT={
  sun:['ttfttf','wttfww','twMttw','tffttt','fttftt'],
  star:['ftfttf','tffwtf','ftfftt','ttftff','fftftf'],
  spring:['fftfff','tfffwf','fftfft','tffftf','ffftff'],
};
function seatAt(h,r,c){ // r: 5..1 top->bottom index 0..4
  const ch=LAYOUT[h][r][c];
  const code=`${String.fromCharCode(65+c)}-${5-r}`;
  const res=S.reserved.find(x=>x.hall===h&&x.code===code);
  const no=r*6+c+1;
  if(ch==='M') return {code,st:MODE==='demo'?'mine':'taken'};
  if(MODE==='real'&&P.hall===h&&(P.seats||[]).includes(no)) return {code,st:'mine'};
  if(res) return {code,st:'mine'};
  if(SRV[h]&&SRV[h].has(r*6+c+1)) return {code,st:'taken'};
  return {code,st:ch==='t'?'taken':ch==='w'?'window':'free'};
}
function remaining(h){ return hallOf(h).left??'-'; }
// ---------- helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),1800)}
let lastFocus=null;
function openSheet(html,testid){lastFocus=document.activeElement;const s=$('#sheet');s.innerHTML='<div class="grab"></div>'+html;s.dataset.kind=testid||'';$('#scrim').classList.add('on');s.classList.add('on');setTimeout(()=>{const f=s.querySelector('textarea,input,button');f&&f.focus()},320)}
function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on');$('#sheet').dataset.kind='';lastFocus&&lastFocus.focus&&lastFocus.focus()}
$('#scrim').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet').classList.contains('on'))closeSheet()});
function petals(){const box=$('#petals');for(let i=0;i<14;i++){const p=document.createElement('span');p.className='petal';p.textContent=['❀','✿','❁'][i%3];p.style.left=Math.random()*100+'%';p.style.color=['#F3C6CF','#FFFFFF','#E7C77B'][i%3];p.style.animationDelay=(Math.random()*.6)+'s';box.appendChild(p);setTimeout(()=>p.remove(),3200)}}
function go(screen,push=true){ if(push&&S.screen!==screen) S.history.push(S.screen); S.screen=screen; render(); }
function back(){ S.screen=S.history.pop()||'home'; render(); }
const LOVER=()=>MODE==='real'&&P&&P.petStatus!=='먼저 떠났어요';
const TABS_ANGEL=[['home','오늘',I.home],['hall','천사 곁',I.hall],['record','추억 남기기',I.plus],['plaza','별빛 광장',I.star],['keep','우리 아이',I.pet]];
const TABS_LOVER=[['home','오늘',I.home],['love','사랑 저장소',I.heart],['record','사랑 담기',I.plus],['plaza','별빛 광장',I.star],['keep','우리 아이',I.pet]];
const TAB_OF={enter:'hall',home:'home',hall:'hall',seat:'hall',visit:'hall',plaza:'plaza',keep:'keep',love:'love'};
function tabbar(){const cur=TAB_OF[S.screen];return `<nav class="tabbar" aria-label="하단 메뉴">${(LOVER()?TABS_LOVER:TABS_ANGEL).map(([k,l,ic])=>`<button data-testid="tab-${k}" ${cur===k?'aria-current="page"':''} onclick="tab('${k}')">${ic}<span>${l}</span></button>`).join('')}</nav>`}
function tab(k){ if(k==='record'){ openRecord(); return; } if(k==='plaza'&&MODE==='real') loadPlaza(); S.history=[]; if(k==='love'){ loadFeed(); go('love',false); return; } if(k==='hall'&&TAB_OF[S.screen]!=='hall'){ go('enter',false); return; } go(k,false); }
function status(){return `<div aria-hidden="true" style="height:calc(14px + env(safe-area-inset-top,0px));flex:none"></div>`}
// ---------- 아이 정보 ----------
const DEMO={id:'demo',name:'보리',kind:'강아지',breed:'',nickname:'보보',birth:'2012-04-03',passed:'2026-09-21',petStatus:'먼저 떠났어요',weight:'3.2',likes:'산책 · 창가 낮잠',tags:['겁 많고 다정함','닭가슴살 마니아','현관에서 기다림'],photo:IMG.portrait,hall:'09-21',hallName:'9월 21일',seats:[15]};
let MODE='loading', P=DEMO, ME=null;
function hasB(w){const c=w.charCodeAt(w.length-1);return c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28>0}
const J=(w,a,b)=>w+(hasB(w)?a:b);
const N=()=>esc(P.name), ga=()=>J(N(),'이','가'), ya=()=>J(N(),'아','야'), ye=()=>J(N(),'이에요','예요');
const dot=d=>d?d.replace(/-/g,'.'):'';
const MYSEAT=()=>(P.seats&&P.seats[0])||0;
function seatText(){ if(LOVER()) return '준비된 사랑꾼'; const n=MYSEAT(); return n?`${P.hallName}의 천사 · ${Angel.ZONES[Angel.zoneOf(n)]}`:(P.hallName?`${P.hallName}의 천사`:''); }
function daysText(){ if(!P.birth) return ''; const end=P.passed?new Date(P.passed):new Date(); const n=Math.floor((end-new Date(P.birth))/864e5)+1; if(n<1) return ''; return P.passed?`함께한 ${n.toLocaleString('ko-KR')}일`:`함께한 지 ${n.toLocaleString('ko-KR')}일째`; }
function birthday(){ if(!P.birth) return ''; const [y,m,d]=P.birth.split('-').map(Number); return `${m}월 ${d}일`; }
function subline(){ return [esc(P.breed||(P.kind&&P.kind!=='-'?P.kind:'')), P.nickname?`별명 ${esc(P.nickname)}`:'', P.passed?`${dot(P.birth)||'?'} ~ ${dot(P.passed)}`:(P.birth?`${dot(P.birth)} 태어남`:'')].filter(Boolean).join(' · '); }
function avatar(size){ return P.photo?`<span class="av" style="width:${size}px;height:${size}px;background-image:url('${P.photo}')"></span>`:`<span class="av" style="width:${size}px;height:${size}px;background:var(--cream);display:grid;place-items:center;font-weight:700;color:#8A6D2C;font-size:${Math.round(size/2.6)}px">${esc(P.name[0]||'')}</span>`; }

async function login(){
  const phone=$('#lg-phone').value, password=$('#lg-pw').value, err=$('#lg-err');
  if(!/^01\d{8,9}$/.test(phone.replace(/\D/g,''))){err.textContent='휴대폰 번호 10~11자리를 확인해 주세요.';$('#lg-phone').focus();return}
  if(!password){err.textContent='비밀번호를 넣어 주세요.';$('#lg-pw').focus();return}
  const b=$('[data-testid=lg-submit]'); b.disabled=true; b.textContent='확인하는 중…';
  try{ await api('/api/login',{method:'POST',body:JSON.stringify({phone,password})}); await boot(); }
  catch(e){ err.textContent=e.message; b.disabled=false; b.textContent='들어가기'; }
}
async function changePw(){ const cur=$('#pw-cur').value, nx=$('#pw-new').value, err=$('#pw-err');
  if(!cur){err.textContent='지금 비밀번호를 넣어 주세요.';return} if(nx.length<6){err.textContent='새 비밀번호는 6자 이상으로 정해 주세요.';return}
  try{ await api('/api/me/password',{method:'PUT',body:JSON.stringify({current:cur,next:nx})}); closeSheet(); toast('비밀번호를 바꿨어요'); }catch(e){ err.textContent=e.message; } }
async function logout(){ try{await api('/api/logout',{method:'POST',body:'{}'})}catch{} location.href='/member'; }
function startDemo(){ MODE='demo'; P=DEMO; S.history=[]; S.screen='entry'; render(); refreshAll(); loadGuestbook(); }
function switchPet(id){ const p=ME.pets.find(x=>x.id===id); if(p&&p.id!==P.id){ startReal(p); S.screen='home'; render(); } }
function nextYearly(md){ const now=new Date(); now.setHours(0,0,0,0); let d=new Date(now.getFullYear(),+md.slice(0,2)-1,+md.slice(3,5)); if(d<now) d=new Date(now.getFullYear()+1,+md.slice(0,2)-1,+md.slice(3,5)); return d; }
function upcoming(){ const out=[], now=new Date(); now.setHours(0,0,0,0); const fmt=d=>`${d.getMonth()+1}월 ${d.getDate()}일`, add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
  if(P.birth){ const d=nextYearly(P.birth.slice(5)); out.push({label:`${N()} 생일`,d}); }
  if(P.passed){ const pd=new Date(P.passed+'T00:00:00');
    [[48,'49재'],[99,'100일']].forEach(([n,l])=>{const d=add(pd,n); if(d>=now) out.push({label:l,d});});
    const k=nextYearly(P.passed.slice(5)); const yrs=k.getFullYear()-pd.getFullYear(); if(yrs>=1) out.push({label:yrs===1?'첫 기일':`${yrs}번째 기일`,d:k}); }
  return out.map(u=>({...u,date:fmt(u.d),days:Math.round((u.d-now)/864e5)})).filter(u=>u.days<=365).sort((a,b)=>a.days-b.days).slice(0,3); }
async function shareMemorial(){ const url=location.origin+'/m/'+P.id, title=`${P.name}의 메모리얼`;
  try{ if(navigator.share){ await navigator.share({title,text:'꽃 한 송이, 한 마디를 남겨 주세요.',url}); return; } await navigator.clipboard.writeText(url); toast('링크를 복사했어요. 가족에게 보내 주세요'); }
  catch(e){ if(e&&e.name==='AbortError') return; prompt('이 링크를 복사해 보내 주세요',url); } }
function startReal(p){
  MODE='real'; P=p;
  Object.assign(S,{screen:'entry',history:[],hall:p.hall,seat:null,reserved:[],flowers:(p.flowers&&p.flowers.today)||0,candle:!!p.candle,todayVisitors:[],guest:[],feed:[],reaction:`${ga()} 반겨요`,heir:'',downloaded:false});
  render(); refreshAll(); loadGuestbook(); loadFeed();
}
function loadGuestbook(){ api('/api/guestbook?pet='+encodeURIComponent(MODE==='real'?P.id:'보리')).then(list=>{ if(MODE==='real'||list.length){ S.guest=list.map(g=>({who:g.who,when:relTime(g.at),text:g.text,at:g.at})); if(MODE==='real') S.todayVisitors=[...new Set(list.filter(g=>new Date(g.at).toDateString()===new Date().toDateString()).map(g=>g.who))]; if(['visit','keep','room'].includes(S.screen)) render(); } }).catch(()=>{}); }
function loadFeed(){ api(`/api/me/pets/${P.id}/feed`).then(list=>{ S.feed=list.map(f=>({who:f.who,av:null,img:f.photo||null,text:f.text,when:relTime(f.at),likes:0})); if(['home','love'].includes(S.screen)) render(); }).catch(()=>{}); }
function refreshAll(){ return Promise.all([P.hall].filter(Boolean).map(refreshSeats)).then(()=>{ if(['hall','seat','enter'].includes(S.screen)) render(); }); }
function openEdit(){

    ${PetForm.html(P,st)}

    <button class="cta navy" style="margin-top:6px" data-testid="ed-save" onclick="saveEdit()">저장하기</button>`,'edit');
  PetForm.bind();
}
async function saveEdit(){
  const d=PetForm.read(); if(!PetForm.validate(d)) return;
  d.name=$('#ed-name').value.trim(); d.petStatus=$('#ed-status').value;
  if(!d.name){$('#ed-err').textContent='아이 이름을 적어 주세요.';$('#ed-name').focus();return}

  <label class="fl" for="wpw">비밀번호 확인</label><input id="wpw" type="password" autocomplete="current-password" class="pwin" data-testid="withdraw-pw">
  <div id="werr" role="alert" style="color:#B2453A;font-size:13px;margin-top:6px;min-height:18px"></div><button class="cta" style="margin-top:8px;background:#A63D33;color:#fff" data-testid="withdraw-send" onclick="sendWithdraw()">30일 뒤 탈퇴하기</button>`,'withdraw')}
async function sendWithdraw(){ const err=$('#werr'); if(!$('#wagree').checked){err.textContent='모든 서비스가 사라지는 데 동의해 주셔야 탈퇴할 수 있어요.';return} if(!$('#wpw').value){err.textContent='비밀번호를 넣어 주세요.';return}
  try{ const d=await api('/api/me/withdraw',{method:'POST',body:JSON.stringify({agree:true,password:$('#wpw').value})}); closeSheet(); await reloadMe(); toast(`탈퇴를 신청했어요. ${dday(d.deleteAt)}`); }catch(e){ err.textContent=e.message; } }
async function cancelWithdraw(){ try{ await api('/api/me/withdraw/cancel',{method:'POST',body:'{}'}); await reloadMe(); toast('탈퇴를 취소했어요. 모든 기억이 그대로 남아요'); }catch(e){ toast(e.message); } }
function dday(iso){ const d=new Date(iso); const n=Math.max(0,Math.ceil((d-Date.now())/864e5)); return `${d.getMonth()+1}월 ${d.getDate()}일에 사라져요 (${n}일 남음)`; }

  if(P.deleteAt) return `<div data-testid="del-banner" style="background:#FBEDEA;color:#7A2E25;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.6"><b>양도 완료</b> · ${N()}의 메모리얼이 ${dday(P.deleteAt)}<br>잘못 양도됐다면 그 전에 운영팀에 알려 주세요.</div>`;
  const pend=(ME&&ME.transfers||[]).filter(t=>t.status==='pending'&&t.petId===P.id);
  return pend.map(t=>`<div data-testid="transfer-pending" style="background:var(--cream);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.6"><b>양도 확인 중</b> · ${esc(t.seatLabel)} → ${esc(t.toPhone)}<br><button onclick="cancelTransfer('${t.id}')" data-testid="transfer-cancel" style="margin-top:6px;height:40px;padding:0 14px;border-radius:10px;background:#fff;font-weight:700;border:1px solid var(--line)">양도 취소하기</button></div>`).join(''); }

      ['backup',I.copy,'세 곳에 나눠 지켜요','사진 한 장도 잃지 않도록 원본 그대로',S.backup?'켜짐':'꺼짐'],
      ['heir',I.people,'이 마음을 이어 갈 가족',S.heir?`보호자가 떠난 뒤에도 ${esc(S.heir)}가 이어서 기억해요`:'언젠가 이 마음을 이어 갈 가족을 정해 두세요',S.heir?'지정됨':'정하기'],
      ['download',I.down,'모든 추억 간직하기','사진·영상·편지를 한 번에 내 곁으로',S.downloaded?'완료':'받기'],
      ['terms',I.lock,'영원히 지키겠다는 약속','어떤 일이 있어도 기억은 다른 곳으로 옮겨 지켜요','읽어 보기'],
    ...(MODE==='real'?[['share',I.people,'가족과 함께 기억하기',LOVER()?'링크로 응원의 한 마디를 받을 수 있어요':'링크로 꽃과 한 마디를 받을 수 있어요','보내기'],['view',I.star,'가족이 보는 '+N()+'의 공간','링크를 받은 가족에게 이렇게 보여요','보기'],['edit',I.pen,N()+' 이야기 다듬기','사진, 태어난 날, 좋아하던 것','다듬기'],...(!P.dayLocked&&P.petStatus!=='먼저 떠났어요'?[['angelday',I.star,'아이가 천사를 만났다면','그날의 천사 곁으로 데려다줄게요','알려 주기']]:[]),['password',I.lock,'비밀번호 바꾸기','임시 비밀번호를 받았다면 꼭 바꿔 주세요','바꾸기'],ME&&ME.account.deleteAt?['withdrawcancel',I.lock,'탈퇴 취소하기',dday(ME.account.deleteAt),'취소']:['withdraw',I.lock,'기억의 집 떠나기','탈퇴하면 30일 뒤 모든 기억이 사라져요','떠나기'],['logout',I.lock,'잠시 나가기',ME?`${esc(ME.account.owner)} · ${esc(ME.account.phone)}`:'','나가기']]:[]),
    ].map(([k,ic,t,d,a])=>`<button class="row" data-testid="keep-${k}" onclick="keep('${k}')" style="margin-bottom:10px">${ic}<span style="flex:1"><b style="font-size:15px">${t}</b><br><span style="font-size:12px;color:var(--sub)" data-testid="keep-${k}-desc">${d}</span></span><b style="font-size:13px;color:${a==='꺼짐'?'#B2453A':'var(--navy)'}" data-testid="keep-${k}-state">${a}</b></button>`).join('')}
  </div>${tabbar()}</section>`;
function keep(k){
  if(k==='edit'){openEdit();return}
  if(k==='angelday'){openAngelDay();return}
  if(k==='share'){shareMemorial();return}
  if(k==='withdraw'){openWithdraw();return}
  if(k==='withdrawcancel'){cancelWithdraw();return}
  if(k==='password'){openSheet(`<h3 id="sheetTitle">비밀번호 바꾸기</h3><p>다른 기기에 로그인된 것은 모두 로그아웃돼요.</p><label class="fl" for="pw-cur">지금 비밀번호</label><input type="password" id="pw-cur" autocomplete="current-password" class="pwin"><label class="fl" for="pw-new">새 비밀번호 <span style="font-weight:400;color:var(--sub);font-size:12px">6자 이상</span></label><input type="password" id="pw-new" autocomplete="new-password" class="pwin"><div id="pw-err" role="alert" style="color:#B2453A;font-size:13px;margin-top:8px;min-height:18px"></div><button class="cta navy" style="margin-top:6px" onclick="changePw()">비밀번호 바꾸기</button>`,'password');return}
  if(k==='view'){window.open('/m/'+P.id,'_blank','noopener');return}
  if(k==='logout'){logout();return}
  if(k==='heir'&&MODE==='real'){openSheet(`<h3 id="sheetTitle">가족 승계</h3><p>보호자가 떠난 뒤 이어서 관리할 가족을 정해요. 실제 서비스에서는 그 가족의 본인인증을 한 번 더 받아요.</p><label class="fl" for="heir-in">가족 이름</label><input type="text" id="heir-in" maxlength="20" value="${esc(S.heir)}"><button class="cta navy" style="margin-top:14px" onclick="const v=$('#heir-in').value.trim();if(v)setHeir(v)">지정하기</button>`,'heir');return}
  if(k==='backup') openSheet(`<h3 id="sheetTitle">3중 백업</h3><p>원본은 서울, 부산, 해외 한 곳에 따로 보관돼요. 영원히 기억하는 곳이라 백업은 끌 수 없어요.</p><div style="display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:14px;padding:14px;margin-top:14px"><b>백업 상태</b><b style="color:var(--ok)" data-testid="backup-state">항상 켜짐</b></div><button class="cta soft" style="margin-top:16px" onclick="closeSheet()">확인</button>`,'backup');
  if(k==='heir') openSheet(`<h3 id="sheetTitle">가족 승계</h3><p>보호자가 떠난 뒤 이어서 관리할 가족을 정해요. 바꿀 때는 본인인증을 한 번 더 해요.</p><label class="fl">승계할 가족</label>${['지수','엄마','동생 민재'].map(n=>`<button class="row" style="border:1.5px solid ${S.heir===n?'var(--navy)':'var(--line)'};margin-bottom:8px" data-testid="heir-${n.replace(' ','')}" onclick="setHeir('${n}')"><span style="flex:1;font-weight:700">${n}</span>${S.heir===n?'<b style="color:var(--navy)">지정됨</b>':''}</button>`).join('')}`,'heir');
  if(k==='download'){ if(S.downloaded){toast('이미 받았어요. 다시 받으려면 잠시 후 시도해 주세요');return}
    openSheet(`<h3 id="sheetTitle">전체 내려받기</h3><p>${MODE==='real'?`사진 ${S.feed.filter(f=>f.img).length+(P.photo?1:0)}장, 편지 ${S.guest.length}통`:`사진 248장, 영상 12개, 편지 ${31+S.guest.length-1}통, 목소리 2개`}를 한 파일로 묶어요.</p><div class="progress"><i id="pbar" data-testid="dl-bar"></i></div><div style="font-size:13px;color:var(--sub);margin-top:8px" data-testid="dl-text">준비 중…</div><button class="cta navy" style="margin-top:16px" data-testid="dl-done" disabled onclick="S.downloaded=true;closeSheet();render();toast('${N().replace(/'/g,'')}의 기억을 모두 받았어요')">파일 저장하기</button>`,'download');
    let p=0;const t=setInterval(()=>{p+=20;const b=$('#pbar');if(!b){clearInterval(t);return}b.style.width=p+'%';$('[data-testid=dl-text]').textContent=p<100?`묶는 중 ${p}%`:'준비됐어요 · 2.4GB';if(p>=100){clearInterval(t);$('[data-testid=dl-done]').disabled=false}},180)}
  if(k==='terms') openSheet(`<h3 id="sheetTitle">보존 약속</h3><p data-testid="terms-body">1. 올려주신 기억은 원본 화질 그대로 영구 보관합니다.<br>2. 회사가 운영을 멈추면, 보존 기금으로 다른 기관에 기억을 옮기고 보호자와 승계 가족에게 알립니다.<br>3. 보호자는 언제든 전체를 내려받을 수 있습니다.<br><span style="font-size:12px">※ 시제품용 문구이며 실제 약관은 법률 검토 후 확정합니다.</span></p><button class="cta soft" style="margin-top:16px" onclick="closeSheet()">확인</button>`,'terms');
}
function setHeir(n){S.heir=n;closeSheet();render();toast(`${n}님을 승계 가족으로 지정했어요`)}

R.plaza=()=>{const list=MODE==='real'?(S.plazaReal||null):S.plaza;return `<section class="screen" data-testid="screen-plaza">
  ${status()}
  <div class="topbar"><span class="title serif">별빛 광장</span></div>
  <p style="padding:0 16px 12px;font-size:13px;color:var(--sub)">오늘 누군가 찾아온 아이들이에요. 숫자도 순위도 없어요.</p>
  <div class="scroll" style="padding:0 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start">
    ${list===null?'<p style="grid-column:1/-1;color:var(--sub);font-size:14px;padding:20px 0;text-align:center">불러오는 중…</p>':list.length?list.map((p,i)=>`<article class="feedcard" style="margin:0" data-testid="plaza-item">${p.id?`<a href="/m/${p.id}" aria-label="${esc(p.name)}의 메모리얼 열기" style="display:block;aspect-ratio:1;background:url('${p.photo}') center/cover"></a>`:`<div style="aspect-ratio:1;background:url(${IMG[p.img]}) center/cover"></div>`}<div style="padding:10px 12px"><b class="serif">${esc(p.name)}</b><div style="font-size:11px;color:var(--sub)">${(p.hallName||p.hall)?esc(p.hallName||p.hall)+'의 천사 곁':''}</div><div style="font-size:11px;color:#8A6D2C;margin-top:4px">${esc(p.note)}</div><button data-testid="plaza-flower" onclick="plazaFlower(${i})" ${S.plazaFlowered[(p.id||i)]?'disabled':''} style="margin-top:8px;width:100%;height:44px;border-radius:12px;font-size:12px;font-weight:700;background:${S.plazaFlowered[(p.id||i)]?'var(--cream)':'#EDEBE6'}">${S.plazaFlowered[(p.id||i)]?'꽃을 놓았어요':'위로의 꽃 놓기'}</button></div></article>`).join(''):`<div style="grid-column:1/-1;background:#fff;border-radius:18px;padding:28px 20px;text-align:center"><b>아직 광장에 나온 아이가 없어요</b><p style="font-size:14px;color:var(--sub);margin-top:6px;line-height:1.6">대표 사진을 넣고 '별빛 광장에 보이기'를 켜면<br>${N()}도 이곳에서 위로의 꽃을 받을 수 있어요.</p></div>`}
  </div>${tabbar()}</section>`};
function plazaFlower(i){ const list=MODE==='real'?S.plazaReal:S.plaza; const p=list[i]; S.plazaFlowered[p.id||i]=true; render(); toast(`${p.name}에게 꽃을 놓았어요`); if(p.id) api(`/api/pets/${p.id}/flower`,{method:'POST',body:'{}'}).catch(()=>{}); }
function loadPlaza(){ api('/api/plaza').then(l=>{ S.plazaReal=l; if(S.screen==='plaza') render(); }).catch(()=>{ S.plazaReal=[]; if(S.screen==='plaza') render(); }); }

function openRecord(){ if(MODE==='real'){ openRealRecord(); return; } openSheet(`<h3 id="sheetTitle">${LOVER()?`오늘의 ${N()} 담기`:`${N()} 기록하기`}</h3><p>${LOVER()?'사진 한 장, 한 줄이면 충분해요. 사랑 저장소에 차곡차곡 쌓여요.':'사진과 한 줄이면 충분해요. 가족 피드에 올라가요.'}</p><label class="fl">사진</label><div style="display:flex;gap:8px">${['p2','p5','p7'].map((k,i)=>`<button data-testid="rec-photo-${i}" aria-pressed="false" onclick="this.parentNode.querySelectorAll('button').forEach(b=>{b.setAttribute('aria-pressed','false');b.style.outline=''});this.setAttribute('aria-pressed','true');this.style.outline='3px solid var(--navy)';window._recImg='${k}'" style="width:72px;height:72px;border-radius:12px;background:url(${IMG[k]}) center/cover"></button>`).join('')}</div><label class="fl" for="rtext">한 줄 기록</label><textarea id="rtext" rows="3" data-testid="rec-text" maxlength="300" placeholder="${LOVER()?`오늘 ${N()}와 있었던 일`:`오늘 떠오른 ${N()}의 모습`}"></textarea><div data-testid="rec-err" style="color:#B2453A;font-size:13px;margin-top:6px;min-height:18px"></div><button class="cta navy" style="margin-top:8px" data-testid="rec-save" onclick="saveRecord()">${LOVER()?'사랑 저장소에 담기':'피드에 올리기'}</button>`,'record');window._recImg=null}
function openRealRecord(){ window._recData=null; openSheet(`<h3 id="sheetTitle">${N()} 기록하기</h3><p>사진과 한 줄이면 충분해요. 가족 피드에 올라가요.</p>
  <label class="fl" for="rfile">사진</label><div style="display:flex;align-items:center;gap:12px"><span id="rpic" style="width:72px;height:72px;border-radius:12px;background:#EDEBE6 center/cover;flex:none"></span><input type="file" id="rfile" accept="image/*" data-testid="rec-file" style="font-size:14px"></div>
  <label class="fl" for="rtext">한 줄 기록</label><textarea id="rtext" rows="3" data-testid="rec-text" maxlength="300" placeholder="오늘 떠오른 ${N()}의 모습"></textarea>
  <div data-testid="rec-err" style="color:#B2453A;font-size:13px;margin-top:6px;min-height:18px"></div>
  <button class="cta navy" style="margin-top:8px" data-testid="rec-save" onclick="saveRealRecord()">피드에 올리기</button>`,'record');
  $('#rfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{window._recData=await PetForm.resize(f);$('#rpic').style.backgroundImage=`url('${window._recData}')`}catch(x){$('[data-testid=rec-err]').textContent=x.message}}; }
async function saveRealRecord(){ const v=$('#rtext').value.trim(); if(!v&&!window._recData){$('[data-testid=rec-err]').textContent='사진을 고르거나 한 줄을 적어 주세요.';return}
  const b=$('[data-testid=rec-save]'); b.disabled=true; b.textContent='올리는 중…';
  try{ const d=await api(`/api/me/pets/${P.id}/feed`,{method:'POST',body:JSON.stringify({text:v,image:window._recData||undefined})}); const f=d.item;
    S.feed.unshift({who:f.who,av:null,img:f.photo||null,text:f.text,when:'방금',likes:0}); closeSheet(); S.history=[]; S.screen='home'; render(); toast('기록을 올렸어요'); }
  catch(e){ $('[data-testid=rec-err]').textContent=e.message; b.disabled=false; b.textContent='피드에 올리기'; } }
function saveRecord(){const v=$('#rtext').value.trim();if(!v&&!window._recImg){$('[data-testid=rec-err]').textContent='사진을 고르거나 한 줄을 적어 주세요.';return}S.feed.unshift({who:'나',av:'me',img:window._recImg,text:v||'',when:'방금',likes:0});closeSheet();S.history=[];S.screen='home';render();toast('기록을 올렸어요')}

let angelView=null;
function render(){ if(angelView){angelView.destroy();angelView=null} $('#view').innerHTML=R[S.screen](); $('#phone').dataset.screen=S.screen; if(S.screen==='enter') mountEnterAngel(); if(S.screen==='seat') mountSeatAngel(); }
const SRV={};
const PHOTOS=['portrait','p1','p2','p3','p4','p5','p7'].map(k=>'/img/'+k+'.jpg');
async function api(path,opt){ const r=await fetch(path,{...opt,headers:{'content-type':'application/json'}}); const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||'잠시 후 다시 시도해 주세요'); return d; }
function seatNo(code){ const c=code.charCodeAt(0)-65, row=Number(code.split('-')[1]); return (5-row)*6+c+1; }
function relTime(iso){ const m=(Date.now()-new Date(iso))/6e4; if(m<2) return '방금'; if(m<60) return `${Math.floor(m)}분 전`; const h=m/60; if(h<24) return new Date(iso).toDateString()===new Date().toDateString()?'오늘':'어제'; const d=Math.floor(h/24); return d<7?`${d}일 전`:new Date(iso).toLocaleDateString('ko-KR'); }
async function refreshSeats(h){ try{ const d=await api(`/api/halls/${h}/seats`); SRV[h]=new Set(d.taken); hallOf(h).left=d.left; }catch(e){} }
function mountEnterAngel(){ const cv=$('#enterAngel'); if(!cv) return;
  const me=MYSEAT(), taken=SRV[P.hall]?[...SRV[P.hall]]:[]; angelView=Angel.mount(cv,{taken,mine:me?[me]:[],picked:me?[me]:[],photos:PHOTOS,animate:true,
    onTap:(s,i)=>toast(s===me?`${P.name}의 별이에요`:i.taken?'누군가 사랑한 아이의 별이에요':'아직 비어 있는 별이에요')});
  angelView.animateIn(2400).then(()=>{const c=$('#enterCap'); if(c) c.style.opacity=1}); }
async function boot(){
  if(new URLSearchParams(location.search).has('demo')){ startDemo(); return; }
  try{ const r=await fetch('/api/me'); if(r.ok){ ME=await r.json(); if(ME.pets.length){ startReal(ME.pets[0]); return; } MODE='nopet'; S.screen='nopet'; render(); return; } }catch{}
  MODE='login'; S.screen='login'; S.history=[]; render(); setTimeout(()=>$('#lg-phone')&&$('#lg-phone').focus(),50);
}
S.screen='loading'; render(); boot();
</script>

</body></html>
